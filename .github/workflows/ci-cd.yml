# .github/workflows/ci-cd.yml
name: CI/CD Pipeline

# Se ejecuta en cada push a las ramas 'main' y 'develop'
on:
  push:
    branches:
      - main
      - develop

jobs:
  # Job para ejecutar los tests
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configura el entorno de Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 3. Ejecuta los tests con Maven
      - name: Run Maven tests
        run: mvn clean test

  # Job para construir y publicar la imagen Docker
  build-and-push-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # Este job se ejecuta solo si el job 'test' fue exitoso
    needs: test

    # Permisos necesarios para que el job pueda escribir en el registro de paquetes de GitHub
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Clona el repositorio para poder leer los tags de git
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Inicia sesión en el Registro de Contenedores de GitHub (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Extrae metadatos (tags y etiquetas) para la imagen Docker
      # Esta acción reemplaza todo el script 'if/else' de GitLab
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      # 4. Construye y publica la imagen Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
