stages:
  - build
  - test
  - deploy

# Job para ejecutar los tests
run_tests:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17  # Imagen Maven con OpenJDK
  script:
    - mvn clean test  # Ejecutar los tests con Maven
  only:
    - main
    - develop
    - feature/tp5

# Job para la construcción de la imagen Docker
build_image:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17  # Imagen Maven para el build
  services:
    - docker:dind  # Habilitar Docker-in-Docker
  variables:
    DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG  # Nombre de la imagen
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY  # Login en el registry Docker
  script:
    - mvn clean install -DskipTests  # Compilar el proyecto
    - docker build --pull -t "$DOCKER_IMAGE_NAME" .  # Construir la imagen Docker
    - docker push "$DOCKER_IMAGE_NAME"  # Subir la imagen al registry Docker
    - |
      if [[ "$CI_COMMIT_BRANCH" == "main" ]]; then
        # Etiquetar como 'latest' en main
        docker tag "$DOCKER_IMAGE_NAME" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
        
        # Agregar versión semántica en 'main'
        VERSION_TAG=$(git describe --tags --abbrev=0 || echo "v1.0.3")
        docker tag "$DOCKER_IMAGE_NAME" "$CI_REGISTRY_IMAGE:$VERSION_TAG"
        docker push "$CI_REGISTRY_IMAGE:$VERSION_TAG"
      fi

      if [[ "$CI_COMMIT_BRANCH" == "develop" ]]; then
        # Etiquetar como 'latest' en develop
        docker tag "$DOCKER_IMAGE_NAME" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi

      if [[ "$CI_COMMIT_BRANCH" == "feature/tp5" ]]; then
        # En feature/tp5 usar el nombre de la rama + hash del commit
        docker tag "$DOCKER_IMAGE_NAME" "$CI_REGISTRY_IMAGE:feature-tp5-$CI_COMMIT_SHA"
        docker push "$CI_REGISTRY_IMAGE:feature-tp5-$CI_COMMIT_SHA"
      fi
  only:
    - main
    - develop
    - feature/tp5
